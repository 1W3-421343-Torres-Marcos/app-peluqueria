[versions]
java = "17"
agp = "8.13.0"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"
fragment = "1.8.9"
navigation = "2.8.5"
lifecycle = "2.8.7"
room = "2.6.1"
work = "2.10.0"
coreSplashscreen = "1.0.1"
